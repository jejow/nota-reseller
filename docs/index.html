<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta
      name="description"
      content="Masuk sebagai pemilik untuk mengelola invoice, klaim garansi, dan pembukuan Nota Reseller."
    />
    <meta name="theme-color" content="#f5f7f5" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://nota-reseller-api.nota-reseller.workers.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Nota Reseller · Invoice & Keuangan</title>
    <link rel="icon" href="./mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css?v=saved-documents" />
    <script type="module" src="./app.mjs?v=saved-documents"></script>
  </head>
  <body class="owner-locked">
    <a class="skip-link" href="#view">Lewati ke konten</a>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Bilah samping"></aside>
      <div class="workspace">
        <header class="topbar" id="topbar"></header>
        <main class="page" id="view" tabindex="-1">
          <p class="loading">Memuat Nota Reseller…</p>
        </main>
      </div>
      <nav class="bottom-nav" id="bottom-nav" aria-label="Navigasi seluler"></nav>
    </div>
    <dialog class="modal" id="modal"></dialog>
    <div class="toast-region" id="toast" role="status" aria-live="polite"></div>
    <section id="print-page" class="print-page" aria-hidden="true"></section>
    <input type="file" id="backup-input" accept=".json,application/json" hidden />
    <noscript>Aktifkan JavaScript untuk menggunakan Nota Reseller.</noscript>
  </body>
</html>
